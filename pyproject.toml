[project]
name = "sec-filings-copilot"
version = "0.1.0"
description = "Cited Q&A copilot over bank SEC 10-K filings (RAG + LangGraph agent)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.0",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langfuse>=2.50",
    "streamlit>=1.38",
]

[project.optional-dependencies]
eval = ["ragas>=0.2"]  # or swap for "deepeval"
kafka = ["confluent-kafka>=2.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
